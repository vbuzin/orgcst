[package]
name = "orgcst-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.orgcst]
path = ".."

# Own workspace, with its own lockfile. The root `exclude` keeps this
# package out of the root workspace, but it is not enough on its own: without
# this table Cargo stops with "current package believes it's in a workspace
# when it's not" even though the path is excluded.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apply"
path = "fuzz_targets/apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
