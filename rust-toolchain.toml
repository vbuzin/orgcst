# The toolchain the crate is built, tested and linted with, here and in CI.
# Moving it is a commit of its own that fixes any new lints with it. The
# minimum supported version is `rust-version` in Cargo.toml, checked by CI's
# msrv job; fuzzing uses nightly.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
